<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pratyush Prasad — software engineer</title>
  <meta name="description" content="Pratyush Prasad is a software engineer building async Python services, queues and the systems around them." />
  <meta property="og:title" content="Pratyush Prasad — software engineer" />
  <meta property="og:description" content="Async Python services, the queues between them, and the dashboards that tell you when they're unhappy." />
  <meta property="og:url" content="https://me.pratcode.dev/" />
  <meta name="theme-color" content="#ecf2fa" />
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
  <script>
    // Apply a saved theme before first paint to avoid a flash
    try { const t = localStorage.getItem('theme'); if (t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { }
  </script>
</head>

<body>
  <!-- Mobile: compact progress bar in place of the rail -->
  <div class="topbar" aria-hidden="true">
    <span class="topbar-hop" id="topbar-hop">intro</span>
    <span class="topbar-track"><span class="topbar-fill" id="topbar-fill"></span></span>
  </div>

  <div class="wrap">
    <aside class="rail" aria-label="Sections">
      <div class="req"><b>Pratyush Prasad</b><br />me.pratcode.dev</div>
      <nav class="hops" id="hops">
        <span class="line"></span><span class="fill" id="fill"></span>
        <a class="hop" href="#intro"><i></i><span><b>intro</b></span></a>
        <a class="hop" href="#about"><i></i><span><b>about</b></span></a>
        <a class="hop" href="#work"><i></i><span><b>work</b></span></a>
        <a class="hop" href="#side-quests"><i></i><span><b>side quests</b></span></a>
      </nav>
      <div class="theme">
        <span>theme:</span>
        <button class="switch" id="theme" type="button" role="switch" aria-checked="false" aria-label="Dark theme"><span class="knob"></span></button>
        <span id="theme-state">light</span>
      </div>
    </aside>

    <main>
      <section id="intro" class="hero">
        <div class="hero-text">
          <h1><span id="name">Pratyush Prasad</span><br /><em id="tagline"></em></h1>
          <p class="lede" id="lede"></p>
          <dl class="hero-meta" id="hero-meta"></dl>
          <p class="links" id="hero-links"></p>
        </div>
        <figure class="hero-art">
          <img src="/images/intro.png" alt="Armoured knight gripping a sword" width="720" height="647" />
        </figure>
      </section>

      <section id="about" class="stage">
        <header class="stage-head"><h2>About</h2></header>
        <div class="cols">
          <div class="prose" id="about-text"></div>
          <dl class="stack" id="stack" aria-label="Tech stack"></dl>
        </div>
      </section>

      <section id="work" class="stage">
        <header class="stage-head"><h2>Work</h2></header>

        <div class="quest">
          <header class="quest-head"><h3>Professional experience</h3></header>
          <div class="timebar" id="timebar"></div>
          <div class="roles" id="roles"></div>
        </div>

        <div class="quest">
          <header class="quest-head"><h3>Personal projects</h3></header>
          <div class="cards" id="projects-list"></div>
        </div>
      </section>

      <section id="side-quests" class="stage">
        <header class="stage-head"><h2>Side quests</h2></header>

        <div class="quest">
          <header class="quest-head"><h3>Bookshelf</h3></header>
          <div class="shelf" id="shelf"></div>
        </div>

        <div class="quest">
          <header class="quest-head"><h3>Projects I am working on</h3></header>
          <div class="slider">
            <div class="slider-nav">
              <button type="button" id="slide-prev" aria-label="Previous project">←</button>
              <button type="button" id="slide-next" aria-label="Next project">→</button>
            </div>
            <div class="slides" id="working-on" tabindex="0" aria-label="Projects I am working on"></div>
          </div>
        </div>

        <div class="quest">
          <header class="quest-head"><h3>My homelab</h3></header>
          <div class="homelab" id="homelab"></div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
